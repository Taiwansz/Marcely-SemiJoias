<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Gradiente de ouro nobre com brilho refinado -->
    <linearGradient id="goldSheen" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#C59B4B" />
      <stop offset="25%" stop-color="#E7C97E" />
      <stop offset="50%" stop-color="#FDF1B8" />
      <stop offset="70%" stop-color="#D4AA5B" />
      <stop offset="90%" stop-color="#A97E33" />
      <stop offset="100%" stop-color="#8E6523" />
    </linearGradient>
    
    <linearGradient id="goldSubtle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C172" />
      <stop offset="50%" stop-color="#BA9045" />
      <stop offset="100%" stop-color="#99702B" />
    </linearGradient>

    <!-- Sombra suave para relevo de papelaria/joalheria de luxo -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8B6914" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#553C08" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Fundo Marfim Suave e Acolhedor (Ivory) -->
  <rect width="800" height="800" fill="#FAF6EE" />

  <!-- Moldura sutil e delicada de monograma de luxo (opcional / elegante) -->
  <circle cx="400" cy="400" r="330" fill="none" stroke="url(#goldSheen)" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="4 6" />
  <circle cx="400" cy="400" r="348" fill="none" stroke="url(#goldSheen)" stroke-width="0.75" stroke-opacity="0.25" />

  <!-- Monograma 'M' Cursivo / Caligráfico refinado com traços de espessura variável -->
  <g filter="url(#softGlow)">
    <!-- Traço principal do 'M' em curvas sinuosas de alta caligrafia -->
    <path d="M 230 520
             C 215 520, 205 510, 210 495
             C 218 470, 245 405, 275 330
             C 292 288, 312 250, 332 250
             C 348 250, 354 275, 342 325
             C 328 385, 305 480, 298 520
             C 294 542, 310 545, 324 522
             C 350 480, 385 390, 420 310
             C 438 270, 458 250, 478 250
             C 498 250, 502 275, 488 330
             C 475 380, 452 475, 448 515
             C 445 538, 460 540, 478 518
             C 512 476, 546 410, 565 370
             C 572 355, 584 355, 582 368
             C 578 388, 542 465, 498 522
             C 468 560, 432 555, 426 515
             L 446 415
             C 424 465, 392 530, 360 560
             C 334 585, 298 575, 280 525
             L 260 490
             C 248 515, 238 520, 230 520 Z" 
          fill="url(#goldSheen)" />

    <!-- Filete decorativo com arabesco e caimento caligráfico de abertura e término -->
    <!-- Entrada fluida à esquerda -->
    <path d="M 190 470
             C 205 430, 235 340, 280 270
             C 310 220, 345 220, 360 255
             C 372 285, 365 340, 345 425
             C 330 490, 335 525, 355 495
             C 375 465, 410 395, 445 320
             C 475 255, 510 225, 535 240
             C 555 252, 558 285, 540 345
             C 525 395, 520 440, 545 430
             C 560 424, 580 395, 595 365" 
          fill="none" 
          stroke="url(#goldSheen)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Ponto ou detalhe sutil de joia (brilho estelar minimalista no ápice) -->
    <circle cx="536" cy="242" r="4.5" fill="url(#goldSheen)" />
    <circle cx="190" cy="470" r="3.5" fill="url(#goldSheen)" />
  </g>

  <!-- Assinatura minimalista abaixo para dar equilíbrio e proporção editorial -->
  <text x="400" y="650" 
        text-anchor="middle" 
        font-family="'Bodoni Moda', 'Playfair Display', 'Didot', serif" 
        font-size="20" 
        font-weight="400" 
        letter-spacing="9" 
        fill="url(#goldSheen)">MARCELY</text>
  <text x="400" y="678" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Cinzel', sans-serif" 
        font-size="10.5" 
        font-weight="300" 
        letter-spacing="7" 
        fill="#A68748">SEMIJOIAS</text>
</svg>